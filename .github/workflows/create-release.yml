name: Create bot release fixture
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      notes:
        description: Release notes
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES"
