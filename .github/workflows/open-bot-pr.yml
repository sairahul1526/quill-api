name: Open bot PR fixture
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario label for the generated change
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a fixture change
        env:
          SCENARIO: ${{ inputs.scenario }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .lab
          printf 'Scenario: %s\n' "$SCENARIO" > .lab/bot-pr.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "bot-fixture/$SCENARIO"
          git add .lab/bot-pr.txt
          git commit -m "test: add bot fixture $SCENARIO"
          git push origin HEAD
          gh pr create --base main --head "bot-fixture/$SCENARIO" --title "Bot fixture $SCENARIO" --body "Generated by workflow_dispatch for the Quillstack lab."
